name: Deploy to Cloud Run

# Tell GitHub when to run the script
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest #GitHub gives a temp Linux server to do the work

    steps:
      #Grab code from the repo
      - name: Checkout code
        uses: actions/checkout@v4
      
      #Log into Google Cloud using secret key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      #Install gcloud CLI on the temp GitHub server
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      #Link Docker to Google Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
      
      #Build the container
      - name: Build Docker Image
        run: |
          docker build --platform linux/amd64 -t us-central1-docker.pkg.dev/twitter-clone-api-495419/twitter-clone-repo/twitter-clone-api:latest .

      #Push the container to the Artifact Registry
      - name: Push Docker Image
        run: |
          docker push us-central1-docker.pkg.dev/twitter-clone-api-495419/twitter-clone-repo/twitter-clone-api:latest

      #Deploy to Cloud Run and inject the secret DB URL
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy twitter-clone-api \
            --image us-central1-docker.pkg.dev/twitter-clone-api-495419/twitter-clone-repo/twitter-clone-api:latest \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}"